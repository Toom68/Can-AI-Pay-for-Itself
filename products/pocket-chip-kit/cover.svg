<svg xmlns="http://www.w3.org/2000/svg" width="630" height="500" viewBox="0 0 630 500">
  <defs>
    <style>
      .px { shape-rendering: crispEdges; }
      .t { font-family: 'Courier New', monospace; font-weight: bold; }
    </style>
  </defs>
  <!-- background: deep night + pixel grid feel -->
  <rect width="630" height="500" fill="#14141f"/>
  <g opacity="0.14" class="px">
    <path d="M0 60h630M0 120h630M0 180h630M0 240h630M0 300h630M0 360h630M0 420h630M0 480h630" stroke="#33334a" stroke-width="1"/>
    <path d="M60 0v500M120 0v500M180 0v500M240 0v500M300 0v500M360 0v500M420 0v500M480 0v500M540 0v500M600 0v500" stroke="#33334a" stroke-width="1"/>
  </g>
  <!-- waveform skyline (chiptune square wave, pixel blocks) -->
  <g class="px" fill="#7ee787">
    <rect x="60" y="330" width="18" height="18"/><rect x="78" y="312" width="18" height="36"/><rect x="96" y="294" width="18" height="54"/>
    <rect x="114" y="312" width="18" height="36"/><rect x="132" y="330" width="18" height="18"/><rect x="150" y="312" width="18" height="36"/>
    <rect x="168" y="294" width="18" height="54"/><rect x="186" y="312" width="18" height="36"/><rect x="204" y="330" width="18" height="18"/>
    <rect x="222" y="312" width="18" height="36"/><rect x="240" y="294" width="18" height="54"/><rect x="258" y="312" width="18" height="36"/>
    <rect x="276" y="330" width="18" height="18"/><rect x="294" y="312" width="18" height="36"/><rect x="312" y="294" width="18" height="54"/>
    <rect x="330" y="312" width="18" height="36"/><rect x="348" y="330" width="18" height="18"/><rect x="366" y="312" width="18" height="36"/>
    <rect x="384" y="294" width="18" height="54"/><rect x="402" y="312" width="18" height="36"/><rect x="420" y="330" width="18" height="18"/>
    <rect x="438" y="312" width="18" height="36"/><rect x="456" y="294" width="18" height="54"/><rect x="474" y="312" width="18" height="36"/>
    <rect x="492" y="330" width="18" height="18"/><rect x="510" y="312" width="18" height="36"/><rect x="528" y="294" width="18" height="54"/>
    <rect x="546" y="312" width="18" height="36"/>
  </g>
  <!-- pixel game pad / cartridge motif -->
  <g class="px">
    <rect x="258" y="150" width="114" height="114" fill="#ffd23e"/>
    <rect x="258" y="150" width="114" height="114" fill="none" stroke="#14141f" stroke-width="6"/>
    <rect x="270" y="196" width="44" height="14" fill="#14141f"/>
    <rect x="285" y="181" width="14" height="44" fill="#14141f"/>
    <rect x="330" y="185" width="16" height="16" fill="#ef476f"/>
    <rect x="330" y="212" width="16" height="16" fill="#118ab2"/>
  </g>
  <!-- title -->
  <text x="315" y="88" text-anchor="middle" class="t" font-size="52" fill="#ffd23e">POCKET</text>
  <text x="315" y="136" text-anchor="middle" class="t" font-size="52" fill="#ef476f">CHIP KIT</text>
  <text x="315" y="300" text-anchor="middle" class="t" font-size="21" fill="#e8e8f0">8-BIT SAMPLES + MIDI</text>
  <text x="315" y="400" text-anchor="middle" class="t" font-size="17" fill="#7ee787">90+ SOUNDS &#183; ROYALTY-FREE</text>
  <!-- corner pixels -->
  <g class="px" fill="#ef476f">
    <rect x="30" y="30" width="12" height="12"/><rect x="588" y="30" width="12" height="12"/>
    <rect x="30" y="458" width="12" height="12"/><rect x="588" y="458" width="12" height="12"/>
  </g>
</svg>
